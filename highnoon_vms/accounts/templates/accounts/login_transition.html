{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="4;url={{ target_url }}">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Access Granted</title>

  <link
    href="https://fonts.googleapis.com/css?family=Inter:400,500,600,700,800"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <style>
    :root {
      --transition-orange: #f26322;
      --transition-orange-dark: #d95518;
      --transition-white: #ffffff;
      --transition-dark: #16181d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Inter", sans-serif;
    }

    body {
      background: var(--transition-orange);
    }

    .transition-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255, 255, 255, 0.14),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          var(--transition-orange),
          var(--transition-orange-dark)
        );
    }

    .transition-grid {
      position: absolute;
      inset: -50%;
      opacity: 0.12;
      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.18) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.18) 1px,
          transparent 1px
        );
      background-size: 55px 55px;
      transform: perspective(700px) rotateX(62deg) translateY(12%);
      animation: gridMove 3s linear infinite;
    }

    .transition-glow {
      position: absolute;
      width: 620px;
      height: 620px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      filter: blur(14px);
      transform: scale(0);
      animation: glowExpand 1.2s ease forwards;
    }

    .transition-content {
      position: relative;
      z-index: 4;
      width: min(520px, calc(100% - 32px));
      text-align: center;
      color: var(--transition-white);
    }

    .logo-text {
      margin-bottom: 32px;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1.5px;
      opacity: 0;
      transform: translateY(-20px);
      animation: logoEnter 0.55s ease forwards;
    }

    .security-ring {
      position: relative;
      width: 132px;
      height: 132px;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .security-ring::before,
    .security-ring::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .security-ring::before {
      border: 3px solid rgba(255, 255, 255, 0.22);
    }

    .security-ring::after {
      border: 3px solid transparent;
      border-top-color: #ffffff;
      border-right-color: #ffffff;
      animation: ringSpin 0.75s linear infinite;
    }

    .check-circle {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: var(--transition-orange);
      font-size: 38px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
      transform: scale(0);
      animation: checkEnter 0.45s 0.55s cubic-bezier(.2, 1.4, .5, 1)
        forwards;
    }

    .transition-title {
      margin: 0;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(18px);
      animation: textEnter 0.45s 0.75s ease forwards;
    }

    .transition-welcome {
      margin: 12px 0 0;
      font-size: 20px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(14px);
      animation: textEnter 0.45s 0.95s ease forwards;
    }

    .transition-message {
      margin-top: 10px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 14px;
      opacity: 0;
      animation: fadeIn 0.4s 1.12s ease forwards;
    }

    .loading-track {
      width: min(330px, 85%);
      height: 5px;
      margin: 28px auto 0;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.22);
      opacity: 0;
      animation: fadeIn 0.3s 1.05s ease forwards;
    }

    .loading-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #ffffff;
      animation: loadingProgress 1.05s 1.05s ease forwards;
    }

    .transition-screen.exit {
      animation: screenExit 0.65s cubic-bezier(.75, 0, .25, 1)
        forwards;
    }

    @keyframes ringSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes gridMove {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 55px 55px;
      }
    }

    @keyframes glowExpand {
      to {
        transform: scale(1.25);
      }
    }

    @keyframes logoEnter {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes checkEnter {
      to {
        transform: scale(1);
      }
    }

    @keyframes textEnter {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes loadingProgress {
      to {
        width: 100%;
      }
    }

    @keyframes screenExit {
      to {
        opacity: 0;
        transform: scale(1.08);
        filter: blur(8px);
      }
    }

    @media (max-width: 575.98px) {
      .logo-text {
        font-size: 32px;
      }

      .security-ring {
        width: 112px;
        height: 112px;
      }

      .check-circle {
        width: 74px;
        height: 74px;
        font-size: 31px;
      }

      .transition-title {
        font-size: 26px;
      }

      .transition-welcome {
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="transition-screen" id="transitionScreen">

    <div class="transition-grid"></div>
    <div class="transition-glow"></div>

    <div class="transition-content">

      <div class="logo-text">
        {% if system_settings %}
            {{ system_settings.company_name }}
        {% else %}
            Highnoon
        {% endif %}
        </div>

      <div class="security-ring">
        <div class="check-circle">
          <i class="fa-solid fa-check"></i>
        </div>
      </div>

      <h1 class="transition-title">
        Access Granted
      </h1>

      <p class="transition-welcome">
        Welcome back, {{ display_name }}
      </p>


      

    </div>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const transitionScreen =
      document.getElementById("transitionScreen");

    const targetUrl = "{{ target_url|escapejs }}";

    console.log("Transition target:", targetUrl);

    window.setTimeout(function () {
      if (transitionScreen) {
        transitionScreen.classList.add("exit");
      }
    }, 1900);

    window.setTimeout(function () {
      if (targetUrl) {
        window.location.href = targetUrl;
      } else {
        window.location.href = "/";
      }
    }, 2450);
  });
</script>

</body>
</html>
