{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="Highnoon logo" sizes="76x76" href="{% static 'assets/img/hn_logo.png' %}">
  <link rel="icon" type="image/png" href="{% static 'assets/img/hn_logo.png' %}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col font-[Inter] bg-gradient-to-br from-orange-600 via-orange-500 to-red-600">

  <header class="fixed top-0 left-0 w-full z-50 bg-white/10 backdrop-blur-md border-b border-white/10">
    <div class="max-w-7xl mx-auto px--100 py-4 flex justify-between items-center">
      <h1 class="text-white text-4xl font-extrabold tracking-tight">Highnoon</h1>
      <span class="hidden md:block text-white text-sm font-semibold border-b-2 border-white pb-1">Sign In</span>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center px-6 pt-24 pb-12">
    <div class="w-full max-w-md">

      <div class="bg-white rounded-2xl shadow-2xl border border-white/30 p-8">

        <div class="text-center mb-8">
          <h2 class="text-3xl font-extrabold text-gray-900 mb-2">Welcome Back</h2>
          <p class="text-gray-500 text-sm">Enter your credentials to access your account</p>
        </div>

        {% if messages %}
          {% for message in messages %}
            <div class="mb-4 rounded-lg px-4 py-3 text-sm
              {% if message.tags == 'error' %}
                bg-red-100 text-red-700
              {% else %}
                bg-green-100 text-green-700
              {% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}" class="space-y-5" id="loginForm">
          {% csrf_token %}

          <div>
            <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">Email / Username</label>
            <input
              type="text"
              name="username"
              id="username"
              required
              placeholder="name@company.com"
              class="w-full px-4 py-3 rounded-lg border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition">
          </div>

          <div>
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
            <input
              type="password"
              name="password"
              id="password"
              required
              placeholder="••••••••"
              class="w-full px-4 py-3 rounded-lg border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition">
          </div>

          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 text-sm text-gray-600">
              <input type="checkbox" name="remember" class="rounded border-gray-300 text-orange-600 focus:ring-orange-500">
              Remember me
            </label>

            <a href="#" class="text-sm font-semibold text-orange-600 hover:underline">Forgot password?</a>
          </div>

          <button
            type="submit"
            class="w-full py-3 px-6 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded-lg transition active:scale-95">
            Sign In
          </button>
        </form>
      </div>

      <div class="mt-8 text-center text-white/80 text-sm">
        ⚠︎ Secure, encrypted connection
      </div>

    </div>
  </main>

  <footer class="bg-black/20 backdrop-blur-md border-t border-white/10">
    <div class="max-w-7xl mx-auto px-6 py-5 text-center md:text-left">
      <span class="text-white/70 text-sm">© 2026 Highnoon. All rights reserved.</span>
    </div>
  </footer>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function () {
      const btn = this.querySelector("button[type='submit']");
      btn.innerText = "Signing In...";
      btn.disabled = true;
    });
  </script>

</body>
</html>
