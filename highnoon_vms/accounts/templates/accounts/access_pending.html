<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Access Denied</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-600 via-orange-500 to-red-600 font-sans">

  <div class="bg-white rounded-2xl shadow-2xl p-10 max-w-md w-full text-center">
    <h1 class="text-3xl font-bold text-gray-900 mb-4">Access Denied</h1>

    <p class="text-gray-600 mb-6">
      
        Your Microsoft account has not been authorized to use Mehmaan.
    </p>

    <a href="{% url 'logout' %}"
       class="inline-block bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-6 rounded-lg">
      Logout
    </a>
  </div>

</body>
</html>
