{% extends "base.html" %}

{% block title %}Map Visitor Card Columns{% endblock %}
{% block breadcrumb %}Visitor Cards{% endblock %}
{% block page_heading %}Map Visitor Card Columns{% endblock %}

{% block content %}

<div class="card">
  <div class="card-header">
    <h6 class="mb-0">Map Excel Columns</h6>
  </div>

  <div class="card-body">
    <form method="POST" action="{% url 'visitor_card_import_process' %}">
      {% csrf_token %}

      <div class="row">

        <div class="col-md-4 mb-3">
          <label class="form-label">Card No</label>
          <select name="CRD_No" class="form-control" required>
            <option value="">Select Excel Column</option>
            {% for header in headers %}
              <option value="{{ header }}" {% if header == "CRD_No" %}selected{% endif %}>{{ header }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Description</label>
          <select name="CRD_Desc" class="form-control" required>
            <option value="">Select Excel Column</option>
            {% for header in headers %}
              <option value="{{ header }}" {% if header == "CRD_Desc" %}selected{% endif %}>{{ header }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Active</label>
          <select name="CRD_Active" class="form-control">
            <option value="">Default Active</option>
            {% for header in headers %}
              <option value="{{ header }}" {% if header == "CRD_Active" %}selected{% endif %}>{{ header }}</option>
            {% endfor %}
          </select>
        </div>

      </div>

      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'visitor_card_list' %}" class="btn btn-secondary btn-sm">Cancel</a>
        <button type="submit" class="btn btn-primary btn-sm">Import Cards</button>
      </div>

    </form>
  </div>
</div>

{% endblock %}
